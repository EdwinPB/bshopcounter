<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="pole" width="240" height="240" patternUnits="userSpaceOnUse" patternTransform="rotate(26)">
      <g opacity="0.55">
        <rect x="-120" y="-240" width="56" height="720" fill="#c94b4b" />
        <rect x="-64" y="-240" width="26" height="720" fill="#ffffff" />
        <rect x="-38" y="-240" width="70" height="720" fill="#3a6fb0" />
        <rect x="32" y="-240" width="34" height="720" fill="#c94b4b" />
        <rect x="66" y="-240" width="14" height="720" fill="#ffffff" />
        <rect x="80" y="-240" width="30" height="720" fill="#3a6fb0" />
        <rect x="110" y="-240" width="10" height="720" fill="#c94b4b" />
        <rect x="120" y="-240" width="60" height="720" fill="#ffffff" />
      </g>
    </pattern>

    <radialGradient id="veil" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c94b4b" stop-opacity="0" />
      <stop offset="30%" stop-color="#3a6fb0" stop-opacity="0.03" />
      <stop offset="60%" stop-color="#3a6fb0" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#c94b4b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#ffffff" />

  <rect width="1200" height="900" fill="url(#flow)" />

  <rect width="1200" height="900" fill="url(#pole)" opacity="0.22" />

  <rect width="1200" height="900" fill="url(#veil)" />

  <g opacity="0.05">
    <path d="M0 0 L150 0 L0 150 Z" fill="#c94b4b" />
    <path d="M1200 0 L1050 0 L1200 150 Z" fill="#3a6fb0" />
    <path d="M0 900 L150 900 L0 750 Z" fill="#3a6fb0" />
    <path d="M1200 900 L1050 900 L1200 750 Z" fill="#c94b4b" />
  </g>
</svg>
