<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Navy base -->
    <rect x="0" y="0" width="512" height="512" fill="#16283f" />

    <!-- Diagonal barber-pole stripes (red / white / blue) -->
    <g transform="rotate(24 256 256)">
      <rect x="118" y="-120" width="64" height="752" fill="#b44b4b" />
      <rect x="182" y="-120" width="40" height="752" fill="#f5f7fa" />
      <rect x="222" y="-120" width="86" height="752" fill="#3f6ea8" />
      <rect x="308" y="-120" width="64" height="752" fill="#b44b4b" />
    </g>
  </g>
</svg>
